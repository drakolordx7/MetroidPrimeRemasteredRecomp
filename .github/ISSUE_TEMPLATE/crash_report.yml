name: "Crash report"
description: "The game closed on its own, or froze and had to be closed."
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach or paste game files, extracted game data, keys (prod.keys, title.keys) or dumps. Screenshots of a bug in a running build are fine.

  - type: input
    id: build
    attributes:
      label: "Build"
      description: "Release version (for example v0.1.0) or commit hash. The version is in the top right corner of mpr_launcher.exe, and on the line 'mpr 0.1.0' near the top of mpr.log."
      placeholder: "v0.1.0 or abc1234"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: "GPU model"
      description: "AMD and Intel reports are welcome. The only GPU tested so far is an NVIDIA GeForce RTX 3080."
      placeholder: "NVIDIA GeForce RTX 3060"
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: "GPU driver version"
      placeholder: "551.23"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: "Windows version"
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: crash_file
    attributes:
      label: "Crash report file"
      description: "Paste the contents of mpr_crash.txt or mpr_fatal.txt (written next to mpr.exe), or drag the file in. Use mpr_freeze.txt instead if the game froze."
      render: text
    validations:
      required: true

  - type: textarea
    id: freeze_report
    attributes:
      label: "Freeze report"
      description: "If the game froze instead of closing, paste mpr_freeze.txt (written next to mpr.exe), if there is one."
      render: text

  - type: textarea
    id: log
    attributes:
      label: "mpr.log"
      description: "Paste the last 200 lines of mpr.log (in the game folder, next to mpr.exe), or drag the file into this box. If you have already started the game again, the crash is in mpr.log.prev."
      render: text
    validations:
      required: true

  - type: textarea
    id: doing
    attributes:
      label: "What you were doing when it crashed"
      description: "Where you were in the game, and what you had just done."
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "How often does it happen?"
      options:
        - "Every time at the same spot"
        - "Sometimes"
        - "Once"
